apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fastapi-app-dev
  namespace: argocd 
spec:
  project: default
  source:
    repoURL: 'https://github.com/Xingyuzxy/fastapi-microservice.git' 
    targetRevision: main                                     
    path: k8s/overlays/dev                                                 
  destination:
    server: 'https://kubernetes.default.svc'                  
    namespace: ns-dev                                        
  syncPolicy:
    automated:
      prune: true     
      selfHeal: true 
    syncOptions:
      - CreateNamespace=true