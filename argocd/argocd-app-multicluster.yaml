apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: fastapi-multicluster
  namespace: argocd
spec:
  generators:
  - clusters: {}
  template:
    metadata:
      name: 'fastapi-app-{{name}}'
    spec:
      project: default
      source:
        repoURL: 'https://github.com/Xingyuzxy/fastapi-microservice.git'
        targetRevision: HEAD
        path: k8s/overlays/prod  
      destination:
        server: '{{server}}'   
        namespace: production
      syncPolicy:
        automated:
          prune: true
          selfHeal: true