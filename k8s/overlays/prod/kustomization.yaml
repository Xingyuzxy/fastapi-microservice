apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namePrefix: prod-

namespace: ns-prod

patches:
  - path: patch-replicas.yaml
    target:
      kind: Deployment
      name: fastapi-app  
  - path: patch-service.yaml
    target:
      kind: Service
      name: fastapi-service 

images:
  - name: ghcr.io/xingyuzxy/my-fastapi-app
    newTag: v1